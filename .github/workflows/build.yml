name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstallato sul runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compila APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk JarvisSveglia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JarvisSveglia-apk
          path: JarvisSveglia.apk

      - name: Pubblica APK (release "ultima" + ramo apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima JarvisSveglia.apk \
            --title "Jarvis Sveglia (ultima versione)" \
            --notes "Compilata dal commit ${GITHUB_SHA::7}. Scarica JarvisSveglia.apk dal telefono e installala."
          mkdir -p /tmp/apkbranch && cp JarvisSveglia.apk /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add JarvisSveglia.apk
          git commit -q -m "APK dal commit ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
